[project]
name = "k0ntrol-cli"
version = "0.1.0"
description = "Local harness for coding agents: deterministic routing, TDD loop, human gates."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ruben Juarez Perez" }]
keywords = ["coding-agents", "ai-agents", "langgraph", "langchain", "tdd", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]
dependencies = [
    "pyyaml>=6",
    "rich>=13",
    "langgraph>=1.2.17,<1.3",
    "langchain>=1.4.7,<1.5",
    "langgraph-checkpoint-sqlite>=3.1.2,<3.2",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.1.0,<2"]
openai = ["langchain-openai>=1.7.2,<2"]
anthropic = ["langchain-anthropic>=1.7.6,<2"]
openrouter = ["langchain-openrouter>=0.2.9,<1"]
aws = ["langchain-aws>=1.9.0,<2"]
google = ["langchain-google-genai>=4.4.2,<5"]
langfuse = ["langfuse>=5.0.4,<6"]
# The same OpenTelemetry pins langfuse 5.x needs, without langfuse itself.
otel = [
    "opentelemetry-api>=1.45.0,<2",
    "opentelemetry-sdk>=1.45.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0,<2",
]
# Every provider at once: `uv tool install "k0ntrol-cli[all]"` gives a global `k0`.
all = ["k0ntrol-cli[ollama,openai,anthropic,openrouter,aws,google]"]

[project.scripts]
k0 = "k0ntrol.cli:main"

[project.urls]
Homepage = "https://github.com/rubjpDev/k0ntrol"
Changelog = "https://github.com/rubjpDev/k0ntrol/blob/main/CHANGELOG.md"
Issues = "https://github.com/rubjpDev/k0ntrol/issues"

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "mypy>=1.15",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# PyPI refuses `k0ntrol` as too close to the existing `kontrol`, so the distribution
# is `k0ntrol-cli` while the import package stays `k0ntrol` and the command `k0`.
[tool.hatch.build.targets.wheel]
packages = ["src/k0ntrol"]

# The sdist carries what a user or packager needs: source, tests and docs.
# The contributor agent setup and brand images stay in the repo.
[tool.hatch.build.targets.sdist]
exclude = [
    ".agents",
    ".claude",
    ".devin",
    ".k0-mem",
    ".github",
    "assets",
    "docs/media",
    "CLAUDE.md",
    "skills-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

# opentelemetry.* ships only in the optional `otel` extra.
[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

# langgraph's StateGraph generics reject dict-in/dict-out node callables;
# only the graph-wiring modules are exempt, and only for call-overload.
[[tool.mypy.overrides]]
module = ["k0ntrol.workflow.fast", "k0ntrol.workflow.full", "k0ntrol.workflow.implement", "k0ntrol.workflow.plan", "k0ntrol.workflow.research", "k0ntrol.workflow.triage"]
disable_error_code = ["call-overload"]
