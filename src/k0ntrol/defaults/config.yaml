# k0ntrol defaults. Override in ~/.k0ntrol/config.yaml, then .k0-mem/config.yaml.
threshold_lines: 350
test_cmd: "pytest -q"   # full suite, never only the new tests
gates: []
max_attempts: 2
test_timeout: 600
max_questions: 25
max_round_questions: 7
ticket_size: small
# search:                     # web search for PLANNER and RESEARCHER
#   provider: brave           # k0's web_search backend (BRAVE_SEARCH_API_KEY)
#   native: false             # true: agents on the openai provider use OpenAI's own
#                             # web search instead, billed per search on top of tokens
agents:
  planner:     {provider: anthropic, model: claude-opus-5-5,   effort: high,   model_calls: 25}
  researcher:  {provider: anthropic, model: claude-sonnet-5-5, effort: medium, model_calls: 40}
  implementer: {provider: anthropic, model: claude-sonnet-5-5, effort: medium, model_calls: 100}
  reviewer:    {provider: anthropic, model: claude-opus-5-5,   effort: high,   model_calls: 25}
  chatty:      {provider: anthropic, model: claude-haiku-5-5,  model_calls: 15}
helpers:
  bulk_read: {provider: anthropic, model: claude-haiku-5-5}
  reflect:   {provider: anthropic, model: claude-haiku-5-5}
