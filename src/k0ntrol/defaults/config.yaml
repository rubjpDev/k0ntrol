# k0ntrol defaults. Override in ~/.k0ntrol/config.yaml, then .k0-mem/config.yaml.
backend: cursor
threshold_lines: 350
test_cmd: "pytest -q"   # full suite, never only the new tests (D24)
max_retries: 2
agents:
  # temperature is advisory with the cursor backend (principle 9)
  spec:        {model: "claude-opus-5-5-high"}
  tester:      {model: "gpt-5.6-luna-max", temperature: 0.2}
  coder:       {model: "gpt-5.6-luna-max", temperature: 0.2}
  validator:   {model: "gpt-5.6-luna-max", temperature: 0.2}
  bulk_reader: {model: "gpt-5.6-luna-max", temperature: 0.2}
