# k0ntrol defaults. Override in ~/.k0ntrol/config.yaml, then .k0-mem/config.yaml.
threshold_lines: 350
test_cmd: "pytest -q"   # full suite, never only the new tests
gates: []
max_attempts: 2
test_timeout: 600
max_questions: 25
max_round_questions: 7
ticket_size: small
# search:                     # web search for PLANNER and RESEARCHER
#   provider: brave           # k0's web_search backend (BRAVE_SEARCH_API_KEY)
#   native: false             # true: agents on openai or anthropic use that provider's own
#                             # web search instead, billed per search on top of tokens
# OpenAI is the default provider: the one the 0.1.0 release check verified live.
agents:
  planner:     {provider: openai, model: gpt-6.1-terra, effort: high,   model_calls: 25}
  researcher:  {provider: openai, model: gpt-6.1-terra, effort: high,   model_calls: 40}
  implementer: {provider: openai, model: gpt-6-luna,    effort: medium, model_calls: 100}
  reviewer:    {provider: openai, model: gpt-6.1-terra, effort: high,   model_calls: 25}
  chatty:      {provider: openai, model: gpt-6-luna,    model_calls: 15}
helpers:
  bulk_read: {provider: openai, model: gpt-6-luna}
  reflect:   {provider: openai, model: gpt-6-luna}
