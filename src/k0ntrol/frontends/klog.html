<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>k0 klog</title>
<script>
// Dark unless the viewer switched to light before; set before first paint.
try { if (localStorage.getItem("k0-klog-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (_) { /* storage blocked */ }
</script>
<style>
/* Palette: the terminal theme (frontends/theme.py). Dark is the default;
   light uses darker shades of the same hues so text keeps its contrast. */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0f14; --panel: #151820; --raise: #1c2029; --text: #e5e7eb; --dim: #9ca3af; --border: #2a2f3a;
  --accent: #a78bfa; --brand: #5eead4; --ok: #4ade80; --error: #f87171; --warn: #fbbf24;
  --s1: #a78bfa; --s2: #5eead4; --s3: #fbbf24; --s4: #60a5fa; --s5: #f472b6; --s6: #6b7280;
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #ffffff; --panel: #f6f7f9; --raise: #eceef2; --text: #111827; --dim: #5b6472; --border: #d9dde3;
  --accent: #6d28d9; --brand: #0f766e; --ok: #15803d; --error: #b91c1c; --warn: #b45309;
  --s1: #7c3aed; --s2: #0d9488; --s3: #d97706; --s4: #2563eb; --s5: #db2777; --s6: #9ca3af;
}
:root {
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html { scrollbar-color: var(--border) var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); caret-color: var(--accent); }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; gap: 12px; }
header .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; min-width: 0; flex: 1; }
h1 { margin: 0; font-size: 20px; color: var(--brand); font-family: var(--mono); letter-spacing: -0.01em; }
.dim { color: var(--dim); }
.icon-button { display: inline-grid; place-items: center; width: 34px; height: 34px; flex: none; border-radius: 8px;
  background: var(--panel); border: 1px solid var(--border); color: var(--dim); cursor: pointer; }
.icon-button:hover { color: var(--text); background: var(--raise); }
.icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
[data-theme="dark"] .when-light, [data-theme="light"] .when-dark { display: none; }

/* totals: one strip, cells divided by rules */
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin: 18px 0 20px;
  border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
.total { padding: 10px 14px; border-left: 1px solid var(--border); margin-left: -1px; }
.total b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.total span { display: block; color: var(--dim); font-size: 12px; }
.total small { display: block; color: var(--dim); font-size: 11px; margin-top: 2px; }

nav { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
nav button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim);
  font: inherit; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
nav button:hover { color: var(--text); }
nav button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
tr:focus-visible { outline-offset: -2px; }
input[type="checkbox"] { accent-color: var(--accent); }

.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; }
tr.row { cursor: pointer; }
tr.row:hover { background: var(--panel); }
td.wrap { white-space: normal; word-break: break-word; min-width: 240px; }
.mono { font-family: var(--mono); font-size: 12px; }
.fail { color: var(--error); }
.denied { color: var(--warn); }
.good { color: var(--ok); }
tr.fail td:first-child { box-shadow: inset 2px 0 var(--error); }
tr.denied td:first-child { box-shadow: inset 2px 0 var(--warn); }
.badge { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border: 1px solid var(--border); border-radius: 4px; color: var(--dim); }
.timeline { background: var(--panel); }
.timeline td { border-bottom-color: transparent; padding: 3px 10px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-all; font: 12px/1.4 var(--mono); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.filters label { display: flex; gap: 6px; align-items: center; color: var(--dim); }
select, input[type="search"] { background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 5px 8px; font: inherit; min-width: 0; }
.more { margin: 12px 0; background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
.more:hover { background: var(--raise); }
.empty { color: var(--dim); margin: 0; padding: 20px 0; }

/* charts */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px 12px; min-width: 0; }
.card h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 12px; margin-bottom: 8px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.sw.line { width: 14px; height: 0; border-radius: 0; background: none; border-top: 1.5px dashed var(--text); opacity: .75; vertical-align: 3px; }
.note { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
.chart { width: 100%; min-width: 0; }
svg.plot { display: block; overflow: visible; }
svg text { fill: var(--text); font: 11px var(--font); }
svg .lbl, svg .tick { fill: var(--dim); }
svg .val { font-family: var(--mono); }
svg .gridline { stroke: var(--border); stroke-width: 1; }
svg .track { fill: var(--dim); opacity: .3; }
svg .avg { fill: none; stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 4 3; opacity: .75; }
svg .area { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.75; }
svg .hit { fill: transparent; }
svg .day.on .hit { fill: var(--text); opacity: .06; }
.c-accent { fill: var(--accent); background: var(--accent); }
.c-brand { fill: var(--brand); background: var(--brand); }
.c-ok { fill: var(--ok); background: var(--ok); }
.c-error { fill: var(--error); background: var(--error); }
.c-warn { fill: var(--warn); background: var(--warn); }
.c-track { fill: var(--dim); background: var(--dim); opacity: .35; }
.s1 { fill: var(--s1); background: var(--s1); } .s2 { fill: var(--s2); background: var(--s2); }
.s3 { fill: var(--s3); background: var(--s3); } .s4 { fill: var(--s4); background: var(--s4); }
.s5 { fill: var(--s5); background: var(--s5); } .s6 { fill: var(--s6); background: var(--s6); }

/* spend board */
.spend-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
.spend-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--panel); }
.segmented button { background: none; border: 0; color: var(--dim); font: inherit; font-size: 13px; padding: 5px 12px; cursor: pointer; }
.segmented button + button { border-left: 1px solid var(--border); }
.segmented button:hover { color: var(--text); }
.segmented button[aria-pressed="true"] { background: var(--raise); color: var(--text); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px 24px; margin-bottom: 18px; }
.kpi > span { display: block; color: var(--dim); font-size: 12px; }
.kpi b { display: block; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.kpi small { display: block; font-size: 12px; color: var(--dim); }
.up { color: var(--warn); }
.down { color: var(--ok); }
.readout { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; min-height: 20px; font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.readout b { color: var(--text); font-size: 13px; font-variant-numeric: tabular-nums; }
.spend-trend { margin-bottom: 14px; }
.wide { grid-column: 1 / -1; }
</style>
</head>
<body>
<main>
  <header>
    <div class="title">
      <h1>k0 klog</h1>
      <span class="dim" id="generated"></span>
    </div>
    <button class="icon-button" id="theme-toggle" type="button">
      <svg class="when-dark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="when-light" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>
  <section class="totals" id="stats" aria-label="Totals"></section>
  <nav role="tablist" aria-label="Views">
    <button role="tab" data-tab="runs">Runs</button>
    <button role="tab" data-tab="spend">Spend</button>
    <button role="tab" data-tab="log">Log</button>
    <button role="tab" data-tab="analytics">Analytics</button>
  </nav>
  <section id="runs" role="tabpanel"></section>
  <section id="spend" role="tabpanel" hidden></section>
  <section id="log" role="tabpanel" hidden>
    <div class="filters">
      <label>Kind <select id="f-kind"></select></label>
      <label>Agent / helper <select id="f-who"></select></label>
      <label>Run <input type="search" id="f-run" placeholder="run or chat id" size="22"></label>
      <label><input type="checkbox" id="f-fail"> Failures only</label>
      <span class="dim" id="f-count"></span>
    </div>
    <div class="scroll" id="log-table"></div>
  </section>
  <section id="analytics" role="tabpanel" hidden></section>
</main>
<script type="application/json" id="k0-data">__K0_DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("k0-data").textContent);
const TOTALS = DATA.analytics.totals;
const PAGE = { runs: 100, log: 500 };
const limits = { runs: PAGE.runs, log: PAGE.log };
const open = new Set();

const $ = (selector) => document.querySelector(selector);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const clip = (text, max) => (String(text).length > max ? String(text).slice(0, max - 1) + "…" : String(text));
const sum = (list) => list.reduce((a, b) => a + b, 0);

function fmtCost(value, estimated) {
  if (value == null) return "–";
  const text = value < 0.01 && value > 0 ? value.toFixed(4) : value.toFixed(2);
  return (estimated ? "~" : "") + "$" + text;
}
function fmtCount(value) {
  if (value >= 1e6) return (value / 1e6).toFixed(1) + "M";
  if (value >= 1e4) return Math.round(value / 1e3) + "k";
  if (value >= 1e3) return (value / 1e3).toFixed(1) + "k";
  return String(value);
}
function fmtMs(ms) {
  if (ms == null) return "–";
  if (ms < 1000) return Math.round(ms) + "ms";
  if (ms < 60000) return (ms / 1000).toFixed(1) + "s";
  return Math.floor(ms / 60000) + "m " + String(Math.round((ms % 60000) / 1000)).padStart(2, "0") + "s";
}
// "Nov 9 14:03", for tight tables.
function fmtShort(ts) {
  const date = new Date(ts);
  if (!ts || isNaN(date)) return ts || "–";
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + date.toLocaleTimeString([], { hour12: false, hour: "2-digit", minute: "2-digit" });
}
function fmtTime(ts, withMs) {
  const date = new Date(ts);
  if (!ts || isNaN(date)) return ts || "–";
  const day = date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const time = date.toLocaleTimeString([], { hour12: false });
  return day + " " + time + (withMs ? "." + String(date.getMilliseconds()).padStart(3, "0") : "");
}
// "2026-11-09" (UTC day) -> "Nov 9"
const fmtDay = (day) => new Date(day + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
const pct = (part, whole) => (whole > 0 ? Math.round((part / whole) * 100) + "%" : "–");

// -- theme -------------------------------------------------------------------

function syncThemeButton() {
  const light = document.documentElement.dataset.theme === "light";
  const label = light ? "Switch to dark theme" : "Switch to light theme";
  const button = $("#theme-toggle");
  button.setAttribute("aria-label", label);
  button.title = label;
}
function toggleTheme() {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("k0-klog-theme", next); } catch (_) { /* storage blocked */ }
  syncThemeButton();
}

// -- totals ------------------------------------------------------------------

function renderTotals() {
  const t = TOTALS;
  const costNote = [t.cost_estimated ? "estimated from list prices" : "", t.unpriced_calls ? t.unpriced_calls + " calls unpriced" : ""]
    .filter(Boolean).join(" · ") || "logged by the provider";
  const stats = [
    [t.runs + t.chats, "runs and chats", t.runs + " runs · " + t.chats + " chats"],
    [fmtCount(t.model_calls), "model calls", ""],
    [fmtCount(t.tokens_in) + " / " + fmtCount(t.tokens_out), "tokens in / out", ""],
    [fmtCost(t.cost, t.cost_estimated), "spend", costNote],
    [t.failures, "failures and denials", ""],
  ];
  $("#stats").innerHTML = stats.map(([value, label, note]) =>
    `<div class="total"><b>${esc(value)}</b><span>${esc(label)}</span>${note ? `<small>${esc(note)}</small>` : ""}</div>`).join("");
  $("#generated").textContent = "updated " + fmtTime(DATA.generated) + " · run /klog again to refresh";
}

// -- one event, in words -----------------------------------------------------

function who(e) { return e.agent || e.helper || ""; }

function detail(e) {
  const parts = [];
  if (e.kind === "model") {
    parts.push(who(e) + (e.helper && !e.agent ? " (helper)" : ""), e.model || "");
    if (e.attempt > 1) parts.push("attempt " + e.attempt);
    if (e.tokens_in != null || e.tokens_out != null) parts.push((e.tokens_in ?? 0) + " → " + (e.tokens_out ?? 0) + " tok");
    if (e.cost != null) parts.push(fmtCost(e.cost, e.estimated));
  } else if (e.kind === "tool") {
    parts.push(e.tool || "", e.path || "");
    if (e.denied) parts.push("denied: " + e.denied);
  } else if (e.kind === "gate") {
    parts.push(e.gate + " → " + e.result);
    if (e.redo && e.redo.length) parts.push("redo " + e.redo.join(", "));
  } else if (e.kind === "run_start") {
    parts.push(e.run_kind || "", e.work_item || "", e.branch || "");
    if (e.resumed) parts.push("resumed");
    if (e.session) parts.push("session " + e.session);
  } else if (e.kind === "run_end") {
    parts.push(e.outcome || "");
    if (e.reason) parts.push(e.reason);
    if (e.node) parts.push("at " + e.node);
  } else {
    parts.push(JSON.stringify(e));
  }
  if (e.err) parts.push(e.err);
  return parts.filter(Boolean).join(" · ");
}

const flagClass = (e) => e.flag || "";
const eventsById = (() => {
  const map = new Map();
  for (const e of DATA.events) {
    const id = e.run || e.chat;
    if (id) (map.get(id) || map.set(id, []).get(id)).push(e);
  }
  return map;
})();

// -- Runs ----------------------------------------------------------------------

function timeline(run) {
  const events = eventsById.get(run.id) || [];
  const origin = Date.parse(events[0] && events[0].ts);
  const rows = events.map((e) => {
    const offset = Date.parse(e.ts) - origin;
    return `<tr class="${flagClass(e)}"><td class="mono dim">${isNaN(offset) ? "" : "+" + fmtMs(offset)}</td>
      <td><span class="badge">${esc(e.kind)}</span></td>
      <td class="wrap ${flagClass(e)}">${esc(detail(e))}</td>
      <td class="num mono dim">${e.ms != null ? fmtMs(e.ms) : ""}</td></tr>`;
  });
  return `<tr class="timeline"><td colspan="12"><div class="scroll"><table>${rows.join("")}</table></div></td></tr>`;
}

function runRow(run, withSession) {
  const outcome = run.outcome || "–";
  const outcomeClass = run.outcome === "done" ? "good" : run.outcome && run.outcome !== "running" ? "fail" : "dim";
  const isOpen = open.has(run.id);
  const head = `<tr class="row ${run.failures ? "fail" : ""}" tabindex="0" data-run="${esc(run.id)}" aria-expanded="${isOpen}">
    <td>${esc(fmtTime(run.start))}</td>
    <td><span class="badge">${esc(run.kind)}</span></td>
    <td>${esc(run.work_item || "–")}</td>
    <td class="mono">${esc(run.branch || "–")}</td>
    ${withSession ? `<td class="mono">${esc(run.session || "–")}</td>` : ""}
    <td class="num">${fmtMs(run.duration_ms)}</td>
    <td class="${outcomeClass}">${esc(outcome)}</td>
    <td class="num">${run.model_calls}</td>
    <td class="num">${fmtCount(run.tokens_in)} / ${fmtCount(run.tokens_out)}</td>
    <td class="num">${fmtCost(run.cost, run.cost_estimated)}</td>
    <td class="num ${run.failures ? "fail" : "dim"}">${run.failures}</td></tr>`;
  return head + (isOpen ? timeline(run) : "");
}

function renderRuns() {
  const runs = DATA.runs;
  if (!runs.length) { $("#runs").innerHTML = '<p class="empty">No runs or chats in the log yet. Start one with /fast, /full or a question.</p>'; return; }
  const withSession = runs.some((r) => r.session);
  const shown = runs.slice(0, limits.runs);
  const headers = ["Started", "Kind", "Work item", "Branch", withSession ? "Session" : null, "Duration", "Outcome", "Calls", "Tokens in / out", "Cost", "Failures"];
  const numeric = new Set(["Duration", "Calls", "Tokens in / out", "Cost", "Failures"]);
  const head = headers.filter(Boolean).map((h) => `<th class="${numeric.has(h) ? "num" : ""}">${h}</th>`).join("");
  const more = runs.length > shown.length ? `<button class="more" data-more="runs">Show ${Math.min(PAGE.runs, runs.length - shown.length)} more of ${runs.length - shown.length}</button>` : "";
  $("#runs").innerHTML = `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${shown.map((r) => runRow(r, withSession)).join("")}</tbody></table></div>${more}`;
}

function focusRun(id) {
  const row = document.querySelector(`tr.row[data-run="${CSS.escape(id)}"]`);
  if (row) { row.focus(); row.scrollIntoView({ block: "nearest" }); }
}

function toggleRun(id) {
  if (open.has(id)) open.delete(id); else open.add(id);
  renderRuns();
  focusRun(id);
}

function gotoRun(id) {
  const index = DATA.runs.findIndex((r) => r.id === id);
  limits.runs = Math.max(limits.runs, index + 1);
  open.add(id);
  showTab("runs");
  renderRuns();
  focusRun(id);
}

// -- Log -------------------------------------------------------------------------

function fillSelect(select, label, values) {
  select.innerHTML = `<option value="">${label}</option>` + values.map((v) => `<option>${esc(v)}</option>`).join("");
}

function initFilters() {
  const unique = (list) => [...new Set(list.filter(Boolean))].sort();
  fillSelect($("#f-kind"), "all", unique(DATA.events.map((e) => e.kind)));
  fillSelect($("#f-who"), "all", unique(DATA.events.map(who)));
  for (const id of ["#f-kind", "#f-who", "#f-run", "#f-fail"]) {
    $(id).addEventListener("input", () => { limits.log = PAGE.log; renderLog(); });
  }
}

function filteredEvents() {
  const kind = $("#f-kind").value, name = $("#f-who").value;
  const run = $("#f-run").value.trim().toLowerCase(), failing = $("#f-fail").checked;
  return DATA.events.filter((e) =>
    (!kind || e.kind === kind) && (!name || who(e) === name) && (!failing || e.flag) &&
    (!run || String(e.run || e.chat || "").toLowerCase().includes(run)));
}

function logRow(e, index) {
  const id = e.run || e.chat || "";
  return `<tr class="row ${flagClass(e)}" tabindex="0" data-raw="${index}">
    <td class="mono">${esc(fmtTime(e.ts, true))}</td>
    <td><span class="badge">${esc(e.kind)}</span></td>
    <td class="mono dim" title="${esc(id)}">${esc(id.slice(0, 8))}</td>
    <td>${esc(who(e))}</td>
    <td class="wrap ${flagClass(e)}">${esc(detail(e))}</td>
    <td class="num mono dim">${e.ms != null ? fmtMs(e.ms) : ""}</td></tr>`;
}

const rawOpen = new Set();
const eventIndex = new Map(DATA.events.map((e, i) => [e, i]));

function renderLog() {
  const matches = filteredEvents().reverse();
  $("#f-count").textContent = matches.length + " of " + DATA.events.length + " events, newest first";
  if (!matches.length) { $("#log-table").innerHTML = '<p class="empty">No events match these filters.</p>'; return; }
  const shown = matches.slice(0, limits.log);
  const rows = shown.map((e) => logRow(e, eventIndex.get(e)) +
    (rawOpen.has(eventIndex.get(e)) ? `<tr class="timeline"><td colspan="6"><pre>${esc(JSON.stringify(e, null, 2))}</pre></td></tr>` : ""));
  const more = matches.length > shown.length ? `<button class="more" data-more="log">Show ${Math.min(PAGE.log, matches.length - shown.length)} more of ${matches.length - shown.length}</button>` : "";
  $("#log-table").innerHTML = `<table><thead><tr><th>Time</th><th>Kind</th><th>Run</th><th>Agent / helper</th><th>Event</th><th class="num">Took</th></tr></thead><tbody>${rows.join("")}</tbody></table>${more}`;
}

function toggleRaw(index) {
  if (rawOpen.has(index)) rawOpen.delete(index); else rawOpen.add(index);
  renderLog();
}

// -- charts: SVG drawn at the container's pixel width, so text stays 11px ----------

const legend = (segments) => `<div class="legend">${segments.map((s) => `<span><i class="sw ${s.cls}"></i>${esc(s.name)}</span>`).join("")}</div>`;
const chartSlot = (id) => `<div class="chart" data-chart="${id}"></div>`;
const plot = (width, height, label, body) =>
  `<svg class="plot" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}">${body}</svg>`;

// The smallest 1, 2 or 5 x 10^n at or above `value`: a round axis top.
function niceMax(value) {
  if (!(value > 0)) return 1;
  const power = 10 ** Math.floor(Math.log10(value));
  return [1, 2, 5, 10].map((m) => m * power).find((top) => top >= value);
}

// Horizontal bars. rows: [{label, values: [..one per segment], text}].
// `overlay` draws each segment from zero (largest first) instead of stacking.
function barChart(width, rows, segments, label, overlay) {
  const labelW = Math.min(170, Math.round(width * 0.32)), rightW = 96, rowH = 20, gap = 7;
  const plotW = Math.max(width - labelW - rightW, 40);
  const total = (r) => (overlay ? Math.max(...r.values) : sum(r.values));
  const max = Math.max(...rows.map(total), 1e-12);
  let body = "";
  rows.forEach((r, i) => {
    const y = i * (rowH + gap);
    let x = labelW;
    body += `<text class="lbl" x="${labelW - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${esc(clip(r.label, Math.floor(labelW / 7.2)))}<title>${esc(r.label)}</title></text>`;
    r.values.forEach((v, j) => {
      const w = (v / max) * plotW;
      body += `<rect class="${r.cls || segments[j].cls}" x="${overlay ? labelW : x}" y="${y}" width="${Math.max(w, v > 0 ? 1 : 0)}" height="${rowH}" rx="2"><title>${esc(segments[j].name + ": " + v)}</title></rect>`;
      if (!overlay) x += w;
    });
    const end = overlay ? labelW + (total(r) / max) * plotW : x;
    body += `<text class="val" x="${end + 6}" y="${y + rowH / 2 + 4}">${esc(r.text)}</text>`;
  });
  return plot(width, rows.length * (rowH + gap) - gap, label, body);
}

// Y axis gridlines at 0, half and top, labelled in dollars.
function yGrid(left, right, top, bottom, max) {
  return [0, 0.5, 1].map((f) => {
    const y = bottom - f * (bottom - top);
    return `<line class="gridline" x1="${left}" x2="${right}" y1="${y}" y2="${y}"/><text class="tick" x="${left - 6}" y="${y + 4}" text-anchor="end">${fmtCost(max * f)}</text>`;
  }).join("");
}

// About six evenly spaced day labels under the plot.
function xTicks(days, xOf, y) {
  const step = Math.max(1, Math.ceil(days.length / 6));
  return days.map((d, i) => (i % step === 0
    ? `<text class="tick" x="${xOf(i)}" y="${y}" text-anchor="middle">${esc(fmtDay(d.day))}</text>` : "")).join("");
}

// -- Spend board ---------------------------------------------------------------------

const RANGES = [["7", "7 days"], ["30", "30 days"], ["90", "90 days"], ["all", "All"]];
const spend = { range: "30", focus: null };
const today = String(DATA.generated).slice(0, 10);
const byDay = new Map(DATA.analytics.by_day.map((d) => [d.day, d]));

function shiftDay(day, offset) {
  const date = new Date(day + "T00:00:00Z");
  date.setUTCDate(date.getUTCDate() + offset);
  return date.toISOString().slice(0, 10);
}
function dayRange(first, last) {
  const days = [];
  for (let day = first; day <= last && days.length < 3660; day = shiftDay(day, 1)) days.push(day);
  return days;
}
const dayCost = (day) => (byDay.get(day) || {}).cost || 0;
const firstDay = DATA.analytics.by_day.length ? DATA.analytics.by_day[0].day : today;

// The selected window, every day in it (zero days included), and the one before it.
function spendWindow() {
  const length = spend.range === "all" ? dayRange(firstDay, today).length : Number(spend.range);
  const start = shiftDay(today, 1 - length);
  return { start, days: dayRange(start, today), previous: spend.range === "all" ? null : dayRange(shiftDay(start, -length), shiftDay(start, -1)) };
}

// Agents ranked by spend in the window; beyond five they share "other".
function agentSeries(days) {
  const totals = {};
  for (const day of days) for (const [name, cost] of Object.entries((byDay.get(day) || {}).agents || {})) totals[name] = (totals[name] || 0) + cost;
  const ranked = Object.keys(totals).filter((n) => totals[n] > 0).sort((a, b) => totals[b] - totals[a]);
  const named = ranked.slice(0, 5);
  const series = named.map((name, i) => ({ name, cls: "s" + (i + 1), of: (agents) => agents[name] || 0 }));
  if (ranked.length > 5) series.push({ name: "other", cls: "s6", of: (agents) => sum(ranked.slice(5).map((n) => agents[n] || 0)) });
  return { series, totals };
}

function windowRuns(start) {
  return DATA.runs.filter((r) => String(r.start || "").slice(0, 10) >= start && r.cost != null);
}

function trendRows(days) {
  return days.map((day) => {
    const trailing = dayRange(shiftDay(day, -6), day).map(dayCost);
    return { day, total: dayCost(day), avg: sum(trailing) / 7, row: byDay.get(day) || { calls: 0, agents: {} } };
  });
}

function kpis(win, runs) {
  const total = sum(win.days.map(dayCost));
  const kpi = (label, value, note) => `<div class="kpi"><span>${esc(label)}</span><b>${value}</b><small>${note}</small></div>`;
  const items = [kpi("Spend", esc(fmtCost(total, TOTALS.cost_estimated)), esc(win.days.length + " days, " + fmtDay(win.start) + " to " + fmtDay(today)))];
  items.push(kpi("Versus the period before", ...changeVersus(total, win.previous)));
  const active = win.days.filter((d) => dayCost(d) > 0).length;
  items.push(kpi("Per active day", esc(fmtCost(active ? total / active : 0)), esc(active + " of " + win.days.length + " days had spend")));
  items.push(kpi("Per run or chat", esc(fmtCost(runs.length ? total / runs.length : 0)), esc(runs.length + " runs and chats")));
  items.push(kpi("This month", ...monthPace()));
  return `<div class="kpis">${items.join("")}</div>`;
}

function changeVersus(total, previous) {
  if (!previous) return ["–", "no earlier period in view"];
  const before = sum(previous.map(dayCost));
  if (before === 0) return [total > 0 ? "new" : "–", esc("nothing spent in the " + previous.length + " days before")];
  const change = (total - before) / before;
  const arrow = change > 0 ? "↑" : change < 0 ? "↓" : "";
  const cls = change > 0 ? "up" : change < 0 ? "down" : "";
  return [`<span class="${cls}">${arrow} ${Math.abs(Math.round(change * 100))}%</span>`, esc("from " + fmtCost(before))];
}

function monthPace() {
  const month = today.slice(0, 7), dayOfMonth = Number(today.slice(8, 10));
  const spent = sum(DATA.analytics.by_day.filter((d) => d.day.startsWith(month)).map((d) => d.cost));
  const length = new Date(Date.UTC(Number(month.slice(0, 4)), Number(month.slice(5, 7)), 0)).getUTCDate();
  const note = dayOfMonth < 3 ? "too early to project" : "on pace for " + fmtCost((spent / dayOfMonth) * length);
  return [esc(fmtCost(spent)), esc(note)];
}

// Daily spend stacked by agent, with the trailing 7-day average as a dashed line.
function trendChart(width, rows, series) {
  const H = 230, left = 56, right = width - 8, top = 10, bottom = H - 24;
  const max = niceMax(Math.max(...rows.map((r) => Math.max(r.total, r.avg)), 0));
  const slot = (right - left) / rows.length, barW = Math.max(Math.min(slot * 0.72, 30), 1);
  const xOf = (i) => left + slot * i + slot / 2, yOf = (v) => bottom - (v / max) * (bottom - top);
  let body = yGrid(left, right, top, bottom, max);
  rows.forEach((r, i) => {
    let y = bottom, bars = "";
    for (const s of series) {
      const h = (s.of(r.row.agents) / max) * (bottom - top);
      if (h > 0) { y -= h; bars += `<rect class="${s.cls}" x="${xOf(i) - barW / 2}" y="${y}" width="${barW}" height="${Math.max(h, 1)}"/>`; }
    }
    body += `<g class="day${spend.focus === i ? " on" : ""}" data-i="${i}"><rect class="hit" x="${left + slot * i}" y="${top}" width="${slot}" height="${bottom - top}"/>${bars}<title>${esc(fmtDay(r.day) + ": " + fmtCost(r.total))}</title></g>`;
  });
  if (rows.length > 1) body += `<polyline class="avg" points="${rows.map((r, i) => xOf(i) + "," + yOf(r.avg)).join(" ")}"/>`;
  body += xTicks(rows, xOf, H - 6);
  return plot(width, H, "Daily spend stacked by agent, with the 7-day average", body);
}

// Running total of spend across the window.
function cumulativeChart(width, rows) {
  const H = 150, left = 56, right = width - 8, top = 10, bottom = H - 24;
  let running = 0;
  const points = rows.map((r) => (running += r.total));
  const max = niceMax(running);
  const step = rows.length > 1 ? (right - left) / (rows.length - 1) : 0;
  const xOf = (i) => (rows.length > 1 ? left + step * i : (left + right) / 2), yOf = (v) => bottom - (v / max) * (bottom - top);
  const line = points.map((v, i) => xOf(i) + "," + yOf(v)).join(" ");
  const area = `<polygon class="area" points="${xOf(0)},${bottom} ${line} ${xOf(points.length - 1)},${bottom}"/>`;
  return plot(width, H, "Running total of spend", yGrid(left, right, top, bottom, max) + area + xTicks(rows, xOf, H - 6));
}

function readout(rows, series) {
  const index = spend.focus ?? rows.length - 1;
  const r = rows[index];
  if (!r) return "";
  const parts = series.map((s) => [s, s.of(r.row.agents)]).filter(([, v]) => v > 0)
    .map(([s, v]) => `<span><i class="sw ${s.cls}"></i>${esc(s.name)} ${esc(fmtCost(v))}</span>`);
  return `<b>${esc(fmtDay(r.day))} · ${esc(fmtCost(r.total))}</b><span>${r.row.calls} calls · 7-day avg ${esc(fmtCost(r.avg))}</span>${parts.join("")}`;
}

// `colors` maps a name to its series class, so agent bars match the trend chart.
function shareBars(width, totals, label, colors = {}) {
  const whole = sum(Object.values(totals));
  const rows = Object.entries(totals).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([name, v]) => ({ label: name, values: [v], text: fmtCost(v) + " · " + pct(v, whole), cls: colors[name] }));
  return rows.length ? barChart(width, rows, [{ name: "spend", cls: "c-accent" }], label) : "";
}

function modelTotals(days) {
  const totals = {};
  for (const day of days) for (const [name, cost] of Object.entries((byDay.get(day) || {}).models || {})) totals[name] = (totals[name] || 0) + cost;
  return totals;
}

function topRuns(runs, total) {
  const top = [...runs].sort((a, b) => b.cost - a.cost).slice(0, 5);
  if (!top.length) return '<p class="empty">No priced runs in this window.</p>';
  const rows = top.map((r) => `<tr class="row" tabindex="0" data-goto="${esc(r.id)}"><td>${esc(fmtShort(r.start))}</td><td><span class="badge">${esc(r.kind)}</span></td>
    <td>${esc(r.work_item || r.branch || "–")}</td><td class="num">${esc(fmtCost(r.cost, r.cost_estimated))}</td><td class="num dim">${pct(r.cost, total)}</td></tr>`);
  return `<div class="scroll"><table><thead><tr><th>Started</th><th>Kind</th><th>Work item</th><th class="num">Cost</th><th class="num">Share</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

function renderSpend() {
  const win = spendWindow(), runs = windowRuns(win.start), rows = trendRows(win.days);
  const { series, totals } = agentSeries(win.days);
  const total = sum(rows.map((r) => r.total));
  const buttons = RANGES.map(([key, name]) => `<button type="button" data-range="${key}" aria-pressed="${spend.range === key}">${name}</button>`).join("");
  const empty = total === 0 ? `<p class="empty">No spend in the last ${win.days.length} days.</p>` : "";
  $("#spend").innerHTML = `<div class="spend-head"><h2>Spend over time</h2><div class="segmented" role="group" aria-label="Time window">${buttons}</div></div>
    ${kpis(win, runs)}
    <div class="card spend-trend"><h2>Daily spend by agent</h2>${empty || legend([...series, { name: "7-day average", cls: "line" }]) + `<div class="readout" id="spend-readout" aria-live="polite">${readout(rows, series)}</div>` + chartSlot("trend")}</div>
    <div class="grid">
      <div class="card"><h2>Running total</h2>${empty || chartSlot("cumulative")}</div>
      <div class="card"><h2>Most expensive runs</h2>${topRuns(runs, total)}</div>
      <div class="card"><h2>Share by agent</h2>${empty || chartSlot("agents")}</div>
      <div class="card"><h2>Share by model</h2>${empty || chartSlot("models")}</div>
    </div>
    ${TOTALS.cost_estimated ? '<p class="note">Days are UTC. Where the provider logged no cost, it is estimated from list prices.</p>' : '<p class="note">Days are UTC.</p>'}`;
  drawCharts("#spend", {
    trend: (w) => trendChart(w, rows, series),
    cumulative: (w) => cumulativeChart(w, rows),
    agents: (w) => shareBars(w, totals, "Spend by agent", Object.fromEntries(series.map((s) => [s.name, s.cls]))),
    models: (w) => shareBars(w, modelTotals(win.days), "Spend by model"),
  });
  spend.rows = rows;
  spend.series = series;
}

function focusDay(index) {
  if (!spend.rows || index == null || index < 0 || index >= spend.rows.length) return;
  spend.focus = index;
  document.querySelectorAll("#spend g.day").forEach((g) => g.classList.toggle("on", Number(g.dataset.i) === index));
  const box = $("#spend-readout");
  if (box) box.innerHTML = readout(spend.rows, spend.series);
}

// -- Analytics ---------------------------------------------------------------------

const card = (title, slot, note, emptyText) => `<div class="card"><h2>${esc(title)}</h2>${slot || `<p class="empty">${esc(emptyText)}</p>`}${note ? `<p class="note">${esc(note)}</p>` : ""}</div>`;
const agentLabel = (r) => r.name + (r.helper ? " (helper)" : "");

function renderAnalytics() {
  const a = DATA.analytics;
  const outcomes = ["done", "stuck", "rejected", "running"].filter((k) => a.outcomes[k]);
  const priceNote = TOTALS.cost_estimated ? "Includes costs estimated from list prices." : "";
  const tokenSegments = [{ name: "in", cls: "c-brand" }, { name: "out", cls: "c-accent" }];
  const latencySegments = [{ name: "p95", cls: "c-track" }, { name: "p50", cls: "c-accent" }];
  const toolSegments = [{ name: "ok", cls: "c-ok" }, { name: "failed", cls: "c-error" }, { name: "denied", cls: "c-warn" }];
  const gateSegments = [{ name: "approved", cls: "c-ok" }, { name: "sent back", cls: "c-error" }];
  $("#analytics").innerHTML = `<div class="grid">${[
    card("Cost per agent", a.by_agent.length && chartSlot("cost"), priceNote, "No model calls yet."),
    card("Tokens per agent", a.by_agent.length && legend(tokenSegments) + chartSlot("tokens"), "", "No model calls yet."),
    card("Model latency", a.latency.length && legend(latencySegments) + chartSlot("latency"), "p50 and p95 of successful calls.", "No successful model calls yet."),
    card("Tool calls", a.tools.length && legend(toolSegments) + chartSlot("tools"), "", "No tool calls yet."),
    card("Gate outcomes", a.gates.length && legend(gateSegments) + chartSlot("gates"), "Approve or pass, against reject, retry, stop or fail.", "No gate has been decided yet."),
    card("Run outcomes", outcomes.length && chartSlot("outcomes"), "", "No /fast or /full run has ended yet."),
  ].join("")}</div>`;
  drawCharts("#analytics", {
    cost: (w) => barChart(w, a.by_agent.map((r) => ({ label: agentLabel(r), values: [r.cost], text: fmtCost(r.cost) })), [{ name: "cost", cls: "c-accent" }], "Cost per agent"),
    tokens: (w) => barChart(w, a.by_agent.map((r) => ({ label: agentLabel(r), values: [r.tokens_in, r.tokens_out], text: fmtCount(r.tokens_in) + " / " + fmtCount(r.tokens_out) })), tokenSegments, "Tokens per agent"),
    latency: (w) => barChart(w, a.latency.map((r) => ({ label: r.model, values: [r.p95, r.p50], text: fmtMs(r.p50) + " / " + fmtMs(r.p95) })), latencySegments, "Model latency", true),
    tools: (w) => barChart(w, a.tools.map((r) => ({ label: r.tool, values: [r.calls - r.failed - r.denied, r.failed, r.denied], text: String(r.calls) })), toolSegments, "Tool calls"),
    gates: (w) => barChart(w, a.gates.map((r) => ({ label: r.gate, values: [r.approved, r.sent_back], text: r.approved + " / " + r.sent_back })), gateSegments, "Gate outcomes"),
    outcomes: (w) => barChart(w, outcomes.map((k) => ({ label: k, values: [a.outcomes[k]], text: String(a.outcomes[k]) })), [{ name: "runs", cls: "c-accent" }], "Run outcomes"),
  });
}

// Fill each chart slot under `root` with its drawing at the slot's width.
function drawCharts(root, drawers) {
  document.querySelectorAll(`${root} [data-chart]`).forEach((slot) => {
    const draw = drawers[slot.dataset.chart];
    if (draw) slot.innerHTML = draw(Math.max(Math.floor(slot.clientWidth), 240));
  });
}

// -- tabs and events ---------------------------------------------------------------

const TABS = ["runs", "spend", "log", "analytics"];
const RENDER = { spend: renderSpend, analytics: renderAnalytics };
let current = "runs";
function showTab(tab) {
  if (!TABS.includes(tab)) tab = "runs";
  current = tab;
  for (const name of TABS) {
    $("#" + name).hidden = name !== tab;
    document.querySelector(`nav [data-tab="${name}"]`).setAttribute("aria-selected", String(name === tab));
  }
  if (RENDER[tab]) RENDER[tab]();
  try { history.replaceState(null, "", "#" + tab); } catch (_) { /* file or sandbox */ }
}

document.addEventListener("click", (event) => {
  const target = event.target.closest("[data-tab],[data-run],[data-raw],[data-more],[data-range],[data-goto],#theme-toggle");
  if (!target) return;
  const d = target.dataset;
  if (target.id === "theme-toggle") toggleTheme();
  else if (d.tab) showTab(d.tab);
  else if (d.run) toggleRun(d.run);
  else if (d.raw) toggleRaw(Number(d.raw));
  else if (d.goto) gotoRun(d.goto);
  else if (d.range) { spend.range = d.range; spend.focus = null; renderSpend(); }
  else if (d.more) { limits[d.more] += PAGE[d.more]; (d.more === "runs" ? renderRuns : renderLog)(); }
});
document.addEventListener("keydown", (event) => {
  if ((event.key === "Enter" || event.key === " ") && event.target.matches("tr.row")) {
    event.preventDefault();
    event.target.click();
  }
});
document.addEventListener("mouseover", (event) => {
  const day = event.target.closest("#spend g.day");
  if (day) focusDay(Number(day.dataset.i));
});

// Redraw the visible charts when the window width changes.
let lastWidth = window.innerWidth;
window.addEventListener("resize", () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  requestAnimationFrame(() => { if (RENDER[current]) RENDER[current](); });
});

syncThemeButton();
renderTotals();
renderRuns();
initFilters();
renderLog();
showTab(location.hash.slice(1));
</script>
</body>
